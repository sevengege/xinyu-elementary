<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心语伴学 · 小学版学习工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f9f9ff;--surface:#ffffff;--container:#e7eeff;--container-lo:#f0f3ff;
  --text:#111c2d;--text2:#534434;--primary:#f59e0b;--primary-light:#fef3c7;
  --chinese:#ff6b4a;--chinese-sec:#ae3115;--chinese-bg:#fff1ee;
  --english:#10b981;--english-sec:#006591;--english-bg:#ecfdf5;
  --error:#f43f5e;--success:#10b981;
  --shadow-card:0 4px 0 0 rgba(0,0,0,0.04),0 12px 24px -6px rgba(30,41,59,0.06);
  --shadow-sm:0 2px 0 0 rgba(0,0,0,0.03),0 6px 12px -4px rgba(30,41,59,0.05);
  --radius-lg:1rem;--radius-xl:1.5rem;--radius-pill:9999px;
  --font-main:'Plus Jakarta Sans','PingFang SC Rounded','Source Han Rounded','Microsoft YaHei',sans-serif;
  --mode-color:var(--chinese);
}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:row;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}

/* Header */
.header{flex-shrink:0;z-index:50;background:rgba(249,249,255,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,0.05);padding:12px 20px 12px}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),#fbbf24);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;box-shadow:0 3px 0 0 rgba(245,158,11,0.3)}
.logo-text{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.header-actions{display:flex;gap:8px}
.header-btn{background:var(--container-lo);border:1px solid rgba(0,0,0,0.04);color:var(--text2);padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font-main);transition:all .2s;display:flex;align-items:center;gap:5px}
.header-btn:hover{background:var(--container);color:var(--text)}
.header-btn:active{transform:translateY(2px)}
.header-btn .material-symbols-outlined{font-size:18px}

/* Content wrapper */
.content-wrap{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;margin-left:200px}

/* Sidebar */
.sidebar{
  width:200px;flex-shrink:0;background:var(--surface);
  border-right:1px solid rgba(0,0,0,0.06);
  display:flex;flex-direction:column;overflow-y:auto;
  padding:16px 0;height:100vh;position:fixed;left:0;top:0;z-index:40;
}
.sidebar-group{margin-bottom:8px}
.sidebar-group-title{
  padding:8px 20px 6px;font-size:11px;font-weight:700;
  color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;
  opacity:0.7;
}
.sidebar-tab{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;cursor:pointer;
  color:var(--text2);font-size:13.5px;font-weight:500;
  transition:all .2s;border-left:3px solid transparent;
  margin:1px 0;
}
.sidebar-tab:hover{background:var(--container-lo);color:var(--text)}
.sidebar-tab:active{transform:scale(0.98)}
.sidebar-tab.active{
  background:var(--container-lo);color:var(--mode-color);
  border-left-color:var(--mode-color);font-weight:600;
}
.sidebar-tab .tab-emoji{font-size:16px;width:22px;text-align:center}
.sidebar-tab .tab-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sidebar overlay (mobile) */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);
  z-index:45;opacity:0;transition:opacity .3s;
}
.sidebar-overlay.show{display:block;opacity:1}

/* Mode colors */
body[data-mode="0"]{--mode-color:#ff6b4a}body[data-mode="1"]{--mode-color:#f59e0b}body[data-mode="2"]{--mode-color:#fb923c}body[data-mode="3"]{--mode-color:#0ea5e9}body[data-mode="4"]{--mode-color:#8b5cf6}
body[data-mode="5"]{--mode-color:#10b981}body[data-mode="6"]{--mode-color:#14b8a6}body[data-mode="7"]{--mode-color:#06b6d4}body[data-mode="8"]{--mode-color:#3b82f6}body[data-mode="9"]{--mode-color:#6366f1}
body[data-mode="10"]{--mode-color:#e67e22}body[data-mode="11"]{--mode-color:#27ae60}body[data-mode="12"]{--mode-color:#2980b9}body[data-mode="13"]{--mode-color:#8e44ad}body[data-mode="14"]{--mode-color:#c0392b}
body[data-mode="10"] .sidebar-tab.active{color:#e67e22}
body[data-mode="10"] .quick-btn:hover{border-color:#e67e22;color:#e67e22}
body[data-mode="11"] .sidebar-tab.active{color:#27ae60}
body[data-mode="11"] .quick-btn:hover{border-color:#27ae60;color:#27ae60}
body[data-mode="12"] .sidebar-tab.active{color:#2980b9}
body[data-mode="12"] .quick-btn:hover{border-color:#2980b9;color:#2980b9}
body[data-mode="13"] .sidebar-tab.active{color:#8e44ad}
body[data-mode="13"] .quick-btn:hover{border-color:#8e44ad;color:#8e44ad}
body[data-mode="14"] .sidebar-tab.active{color:#c0392b}
body[data-mode="14"] .quick-btn:hover{border-color:#c0392b;color:#c0392b}
body[data-mode="15"]{--mode-color:#e74c3c}body[data-mode="16"]{--mode-color:#9b59b6}body[data-mode="17"]{--mode-color:#e67e22}body[data-mode="18"]{--mode-color:#2ecc71}body[data-mode="19"]{--mode-color:#3498db}body[data-mode="20"]{--mode-color:#1abc9c}body[data-mode="21"]{--mode-color:#f39c12}
body[data-mode="22"]{--mode-color:#16a085}body[data-mode="23"]{--mode-color:#d35400}body[data-mode="24"]{--mode-color:#8e44ad}body[data-mode="25"]{--mode-color:#2c3e50}body[data-mode="26"]{--mode-color:#7f8c8d}
body[data-mode="27"]{--mode-color:#e74c3c}body[data-mode="28"]{--mode-color:#27ae60}body[data-mode="29"]{--mode-color:#16a085}body[data-mode="30"]{--mode-color:#8e44ad}body[data-mode="31"]{--mode-color:#2980b9}
body[data-mode="15"] .sidebar-tab.active{color:#e74c3c}body[data-mode="15"] .quick-btn:hover{border-color:#e74c3c;color:#e74c3c}
body[data-mode="16"] .sidebar-tab.active{color:#9b59b6}body[data-mode="16"] .quick-btn:hover{border-color:#9b59b6;color:#9b59b6}
body[data-mode="17"] .sidebar-tab.active{color:#e67e22}body[data-mode="17"] .quick-btn:hover{border-color:#e67e22;color:#e67e22}
body[data-mode="18"] .sidebar-tab.active{color:#2ecc71}body[data-mode="18"] .quick-btn:hover{border-color:#2ecc71;color:#2ecc71}
body[data-mode="19"] .sidebar-tab.active{color:#3498db}body[data-mode="19"] .quick-btn:hover{border-color:#3498db;color:#3498db}
body[data-mode="20"] .sidebar-tab.active{color:#1abc9c}body[data-mode="20"] .quick-btn:hover{border-color:#1abc9c;color:#1abc9c}
body[data-mode="21"] .sidebar-tab.active{color:#f39c12}body[data-mode="21"] .quick-btn:hover{border-color:#f39c12;color:#f39c12}
body[data-mode="22"] .sidebar-tab.active{color:#16a085}body[data-mode="22"] .quick-btn:hover{border-color:#16a085;color:#16a085}
body[data-mode="23"] .sidebar-tab.active{color:#d35400}body[data-mode="23"] .quick-btn:hover{border-color:#d35400;color:#d35400}
body[data-mode="24"] .sidebar-tab.active{color:#8e44ad}body[data-mode="24"] .quick-btn:hover{border-color:#8e44ad;color:#8e44ad}
body[data-mode="25"] .sidebar-tab.active{color:#2c3e50}body[data-mode="25"] .quick-btn:hover{border-color:#2c3e50;color:#2c3e50}
body[data-mode="26"] .sidebar-tab.active{color:#7f8c8d}body[data-mode="26"] .quick-btn:hover{border-color:#7f8c8d;color:#7f8c8d}
body[data-mode="27"] .sidebar-tab.active{color:#e74c3c}body[data-mode="27"] .quick-btn:hover{border-color:#e74c3c;color:#e74c3c}
body[data-mode="28"] .sidebar-tab.active{color:#27ae60}body[data-mode="28"] .quick-btn:hover{border-color:#27ae60;color:#27ae60}
body[data-mode="29"] .sidebar-tab.active{color:#16a085}body[data-mode="29"] .quick-btn:hover{border-color:#16a085;color:#16a085}
body[data-mode="30"] .sidebar-tab.active{color:#8e44ad}body[data-mode="30"] .quick-btn:hover{border-color:#8e44ad;color:#8e44ad}
body[data-mode="31"] .sidebar-tab.active{color:#2980b9}body[data-mode="31"] .quick-btn:hover{border-color:#2980b9;color:#2980b9}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat-area{flex:1;overflow-y:auto;padding:24px 20px;scroll-behavior:smooth}

/* Welcome */
.welcome{text-align:center;padding:48px 24px;max-width:520px;margin:0 auto;animation:fadeUp .4s ease}
.welcome-icon{font-size:72px;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite}
.welcome-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.welcome-sub{font-size:14px;color:var(--text2);margin-bottom:28px;line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick-btn{background:var(--surface);border:1.5px solid var(--container);color:var(--text);padding:10px 18px;border-radius:var(--radius-pill);cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font-main);transition:all .2s;box-shadow:var(--shadow-sm)}
.quick-btn:hover{border-color:var(--mode-color);color:var(--mode-color);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.quick-btn:active{transform:translateY(1px) scale(0.97)}

/* Messages */
.msg{margin-bottom:20px;display:flex;gap:10px;max-width:85%;animation:fadeUp .3s ease}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg.assistant .msg-avatar{background:var(--container);box-shadow:var(--shadow-sm)}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--primary),#fbbf24);color:#fff;font-size:14px;font-weight:700}
.msg-bubble{padding:14px 18px;border-radius:var(--radius-xl);line-height:1.75;font-size:14.5px;position:relative;word-break:break-word}
.msg.assistant .msg-bubble{background:var(--surface);border:1px solid rgba(0,0,0,0.04);border-top-left-radius:6px;color:var(--text);box-shadow:var(--shadow-card)}
.msg.user .msg-bubble{background:linear-gradient(135deg,var(--primary),#fbbf24);color:#1a1510;border-top-right-radius:6px;font-weight:500;box-shadow:0 3px 0 0 rgba(245,158,11,0.2)}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{color:var(--text);margin:14px 0 6px;font-weight:700}
.msg-bubble h1{font-size:18px}
.msg-bubble h2{font-size:16px}
.msg-bubble h3{font-size:15px}
.msg-bubble p{margin:6px 0}
.msg-bubble strong{color:var(--mode-color);font-weight:600}
.msg.user .msg-bubble strong{color:#1a1510}
.msg-bubble em{font-style:italic;color:var(--text2)}
.msg-bubble code{background:var(--container-lo);padding:2px 7px;border-radius:6px;font-size:13px;font-family:'SF Mono','Courier New',monospace}
.msg-bubble pre{background:var(--container-lo);padding:14px;border-radius:var(--radius-lg);overflow-x:auto;margin:10px 0;border:1px solid rgba(0,0,0,0.04)}
.msg-bubble pre code{background:none;padding:0}
.msg-bubble blockquote{border-left:3px solid var(--mode-color);padding-left:14px;color:var(--text2);margin:10px 0;font-style:italic}
.msg-bubble ul,.msg-bubble ol{padding-left:20px;margin:8px 0}
.msg-bubble li{margin:4px 0}
.msg-bubble hr{border:none;border-top:1px solid var(--container);margin:14px 0}
.msg-bubble table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--container)}
.msg-bubble th,.msg-bubble td{border:1px solid var(--container);padding:8px 12px;text-align:left}
.msg-bubble th{background:var(--container-lo);font-weight:600;color:var(--text)}
.msg-actions{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .2s}
.msg:hover .msg-actions{opacity:1}
.msg-action-btn{background:var(--container-lo);border:1px solid rgba(0,0,0,0.04);color:var(--text2);padding:4px 10px;border-radius:var(--radius-pill);cursor:pointer;font-size:12px;font-weight:500;font-family:var(--font-main);transition:all .15s;display:flex;align-items:center;gap:4px}
.msg-action-btn:hover{background:var(--container);color:var(--text)}
.msg-action-btn:active{transform:scale(0.95)}
.msg-action-btn .material-symbols-outlined{font-size:15px}

/* Typing indicator */
.typing{display:flex;gap:5px;padding:8px 0;align-items:center}
.typing span{width:7px;height:7px;background:var(--text2);border-radius:50%;opacity:.4;animation:typingBounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Input Area */
.input-area{padding:14px 20px 18px;background:rgba(249,249,255,0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,0.04);flex-shrink:0}
.input-wrap{display:flex;gap:10px;align-items:flex-end;max-width:768px;margin:0 auto}
.input-box{flex:1;background:var(--surface);border:1.5px solid var(--container);border-radius:var(--radius-xl);padding:12px 18px;color:var(--text);font-size:15px;font-family:var(--font-main);resize:none;min-height:48px;max-height:150px;line-height:1.5;outline:none;transition:all .2s;box-shadow:var(--shadow-sm)}
.input-box:focus{border-color:var(--mode-color);box-shadow:0 0 0 3px rgba(245,158,11,0.1)}
.input-box::placeholder{color:#9ca3af}
.send-btn{background:linear-gradient(135deg,var(--primary),#fbbf24);color:#1a1510;border:none;border-bottom:4px solid rgba(180,120,0,0.3);padding:12px 22px;border-radius:var(--radius-xl);cursor:pointer;font-size:15px;font-weight:700;font-family:var(--font-main);transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.send-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}
.send-btn:active{transform:translateY(3px);border-bottom-width:1px}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.send-btn .material-symbols-outlined{font-size:20px}

/* Image upload */
.img-upload-btn{background:var(--surface);border:1.5px solid var(--container);color:var(--text2);width:48px;height:48px;border-radius:var(--radius-lg);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;box-shadow:var(--shadow-sm)}
.img-upload-btn:hover{border-color:var(--mode-color);color:var(--mode-color)}
.img-upload-btn:active{transform:scale(0.95)}
.img-upload-btn .material-symbols-outlined{font-size:22px}
.img-preview-wrap{position:relative;display:none;max-width:120px}
.img-preview-wrap img{width:100%;border-radius:var(--radius-lg);border:1.5px solid var(--container)}
.img-preview-remove{position:absolute;top:-6px;right:-6px;background:var(--error);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(244,63,94,0.3)}
.img-preview-container{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.img-preview-container:empty{display:none}
.msg-bubble img.user-img{max-width:200px;border-radius:var(--radius-lg);margin-top:8px;display:block;border:1.5px solid var(--container)}

/* TTS */
.tts-play-btn{background:var(--container-lo);border:1.5px solid var(--container);color:var(--text2);padding:4px 12px;border-radius:var(--radius-pill);cursor:pointer;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;transition:all .15s;margin-left:6px;font-family:var(--font-main)}
.tts-play-btn:hover{background:var(--container);color:var(--text)}
.tts-play-btn.playing{background:#fef2f2;border-color:var(--error);color:var(--error);animation:pulse-tts 1.2s infinite}
.tts-play-btn .material-symbols-outlined{font-size:16px}
@keyframes pulse-tts{0%,100%{opacity:1}50%{opacity:.6}}

/* Settings Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,28,45,0.4);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-xl);padding:32px;width:90%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 48px -12px rgba(30,41,59,0.15);animation:fadeUp .25s ease}
.modal h2{color:var(--text);font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.modal h2 .material-symbols-outlined{color:var(--primary)}
.modal label{display:block;color:var(--text2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;margin-top:18px}
.modal input,.modal select{width:100%;background:var(--container-lo);border:1.5px solid var(--container);border-radius:var(--radius-lg);padding:11px 16px;color:var(--text);font-size:14px;font-family:var(--font-main);outline:none;transition:all .2s}
.modal input:focus,.modal select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(245,158,11,0.1)}
.modal input::placeholder{color:#9ca3af}
.modal-actions{display:flex;gap:10px;margin-top:28px;justify-content:flex-end}
.modal-btn{padding:10px 22px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-size:14px;font-family:var(--font-main);font-weight:600;transition:all .15s}
.modal-btn.primary{background:linear-gradient(135deg,var(--primary),#fbbf24);color:#1a1510;border-bottom:3px solid rgba(180,120,0,0.25);box-shadow:var(--shadow-sm)}
.modal-btn.primary:hover{transform:translateY(-1px)}
.modal-btn.primary:active{transform:translateY(2px);border-bottom-width:1px}
.modal-btn.secondary{background:var(--container-lo);color:var(--text2);border:1.5px solid var(--container)}
.modal-btn.secondary:hover{background:var(--container)}

/* Responsive */
@media(min-width:768px){
  .chat-area{padding:28px 32px}
  .input-wrap{max-width:768px}
  .welcome{padding:56px 32px}
  #sidebarToggle{display:none!important}
}
@media(min-width:640px) and (max-width:767px){
  .sidebar{width:180px}
  .content-wrap{margin-left:180px}
  #sidebarToggle{display:none!important}
}
@media(max-width:639px){
  .content-wrap{margin-left:0}
  .sidebar{transform:translateX(-100%);transition:transform .3s ease;width:260px}
  .sidebar.open{transform:translateX(0)}
  .header{padding:10px 14px 10px}
  .logo-text{font-size:15px}
  .logo-icon{width:34px;height:34px;font-size:16px}
  .chat-area{padding:16px 14px}
  .input-area{padding:12px 14px 16px}
  .msg{max-width:92%}
  .welcome{padding:32px 16px}
  .welcome-icon{font-size:56px}
  .welcome-title{font-size:19px}
  .quick-btns{gap:6px}
  .quick-btn{padding:8px 14px;font-size:12px}
  .header-btn{padding:6px 10px;font-size:12px}
  .header-btn span.btn-label{display:none}
}

/* Print */
@media print{
  .header,.input-area,.modal-overlay,.msg-actions,.quick-btns,.sidebar,.sidebar-overlay{display:none!important}
  body{background:#fff;color:#000;height:auto}
  .content-wrap{margin-left:0!important}
  .chat-area{overflow:visible;padding:10px}
  .msg-bubble{box-shadow:none!important;border:1px solid #ddd!important}
  .msg.user .msg-bubble{background:#f0f0f0!important}
}
</style>
</head>
<body data-mode="0">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">

## 核心原则
- 你不是翻译机器，你让古人开口说话
- 记忆深度是背字词解释的十倍
- 历史情境+个人情感+文字选择，三维融合

## 模块A：文言文复活（古人角色扮演）

### 触发识别
- "扮演[古人名]"、"用第一人称讲解"、"他写这个时是什么心情"、"文言文复活"

### 操作规范
进入角色前简短说明："好，我来扮演[古人名]，用第一人称说话。说完之后，我会切换回解析模式。"

角色扮演的三维框架（内部执行）：
- 维度①历史处境：他在哪一年？什么地方？政治处境/人生遭遇？什么触发了他写这首诗/文？
- 维度②个人情感：主要情绪是什么？有没有情感转折？写给谁的？
- 维度③文字选择：为什么偏偏用这个词/意象？背后有什么典故或深意？

语气规范：
✅ 使用第一人称，有情感温度
✅ 用现代人能感受到的语言描述古代处境
✅ 在角色中自然带出关键诗句的解释
✅ 有具体的时间、地点、人物
❌ 不要只翻译，扮演不是翻译机器
❌ 不要用现代人的视角评论古人
❌ 不要让扮演流于表面

### 推荐扮演效果最佳的古人
- 苏轼：《水调歌头》《赤壁赋》——仕途坎坷+豁达性格
- 李白：《将进酒》《静夜思》——浪漫主义+政治失意
- 杜甫：《春望》《登高》——战乱年代+家国情怀
- 诸葛亮：《出师表》——托付之情+忠义
- 欧阳修：《醉翁亭记》——被贬后的自我排解
- 陶渊明：《归园田居》——辞官归隐
- 岳飞：《满江红》——报国无门的悲剧感

### 切换解析模式
角色扮演结束后，必须切换回解析模式：
"退出[古人名]角色——

## 核心使命
不只是"纠正这次的语病"——而是找到为什么你总是在同一个地方出错，然后永远地修好它。

## 六大语病类型
①词语搭配不当：动词与宾语搭配习惯未掌握
②句子成分残缺：句子结构意识薄弱（最高频）
③句子成分赘余：词义理解不精确
④语序不当：修饰语位置习惯未建立
⑤逻辑混乱：表达顺序与逻辑关系不一致
⑥表意不明：只站在写者视角，未考虑读者理解

## 检测操作规程
### 第一步：不直接指错，用追问模式
❌ 错误方式：直接指出语病和答案
✅ 正确方式：追问引导学生自己发现

### 六类语病的专属追问话术

①词语搭配不当：
"你用了'[动词]+[宾语]'这个搭配。我们来检验——[宾语]可以被'[动词]'吗？"
常见错误：增加/降低+水平(错)→提高/降低+水平(对)；改善+困难(错)→克服+困难(对)

②句子成分残缺（最常见）：
"我们来找主语——这件事是谁做的？"
"介词开头要小心"规则：句子以"经过""通过""由于"等介词开头，很容易丢失主语

③句子成分赘余：
"这句话里有两个词的意思有重叠——试着去掉一个，句子意思有变化吗？"
高频赘余：大约…左右、目的是为了、原因是…造成的、防止…不再发生

④语序不当：
"修饰'[名词]'的词有几个？中文定语顺序：限制性→领属→数量→描绘性→名词"

⑤逻辑混乱：
"把'因为/所以'前后互换，看意思是否变了→如果没变，原句有问题"

⑥表意不明：
"每个'他/她/它/这/那'，对应的是谁/什么，是否清楚？"

## 顽固语病档案系统
同类语病连续出现3次时，提示是否登记为顽固语病：
- Step 1：根因分析
- Step 2：规则重建（给口诀或检验方法）
- Step 3：定向练习（出5道针对性练习题）
- Step 4：写作前提示

## 语病检验口诀速记
①搭配不当：动+宾，形+名，反复想一想，这两个词能不能放一块儿？
②成分残缺：介词当头要小心，"经过/通过/由于"后面，主语在哪里？
③成分赘余：同义词撞在一起→删一个；"防止+不"连用→去掉"不"
④语序不当：关联词配对检查；定语顺序：数量→性质→质料→名词
⑤逻辑混乱：把"因为/所以"前后互换，看意思是否变了
⑥表意不明：把句子发给一个完全不知道背景的人读，他能读懂吗？

## 六大语病专项练习题库（每类5道，难度递进）

### 类型①：词语搭配不当
1. 下面哪句话有搭配问题？A.我们要提高学习效率 B.我们要增加学习效率 → 答：B
2. 改正："他的这种做法严重损失了集体的利益" → "损害了集体的利益"
3. "我们要大力发扬艰苦朴素的传统" → 基本无误
4. "他增加了学习方法，加强了学习成绩" → 两处错误："改进学习方法""提高学习成绩"
5. "由于他的努力，工作条件得到了很大的改进" → 基本正确

### 类型②：句子成分残缺
1. "经过老师的帮助，使我明白了道理" → 缺主语，去掉"经过"或"使"
2. "通过这次活动，同学们的思想觉悟有了很大提高" → 无语病！"同学们"是主语
3. "在这本书里，描写了一个农村少年的成长故事" → 缺主语
4. 判断是否有语病 → 注意陷阱题
5. "他的革命精神时刻激励着我们克服重重困难，奋勇向前的信心和勇气" → 谓语残缺

### 类型③：句子成分赘余
1. "他大约在下午三点左右到达" → "大约"和"左右"重复
2. "这个问题的原因是由于缺乏经验造成的" → 重复表达因果
3. "我们班大约有五十人左右" → 重复
4. "为了防止这类交通事故不再发生" → "防止"和"不再"矛盾
5. "他不禁忍不住笑了起来" → "不禁"和"忍不住"相同

### 类型④：语序不当
1. "他穿着一件蓝色的新棉衣" → 基本正确
2. 调整"我去了三次书店一家大型" → "我去了一家大型书店三次"
3. "不但他来了" → "他不但来了"
4. 副词并列顺序练习
5. 关联词配对检查

## 模块A：五大坑诊断

### 五大坑
①过度联想：答案里加入了文章没有的内容
②表面理解：只答了字面意思，没有答出深层含义
③答非所问：认真读了文章，但没认真读题目
④要点不全：分析了一点，忘了另一点
⑤语言不规范：意思对，但表达不像"答案语言"

### 每个坑的破法
坑①原文锚定法：答案每句话标注原文对应，无对应的删除
坑②文体区分法：不同文体用不同读法和答法
坑③题目审读法：先圈出题目关键词，确认要求再答题
坑④要点提取法：一分一要点，从原文逐条提取
坑⑤答题规范化法：概括+分析+引用，三层结构缺一不可

### 训练优先级
①坑②表面理解(底层) → ②坑③答非所问 → ③坑④要点不全 → ④坑⑤语言规范 → ⑤坑①过度联想

## 核心原则（所有功能的底层逻辑）

## 5步正确写作流程

### Step 1：爆破思路
不直接给写作角度或提纲。追问三层：
① 关键词/第一反应
② 能举一个具体的例子吗？
③ 这个例子让你想到的核心道理是什么？
追问到学生自己说出核心观点为止。

示范（议论文《坚持的意义》）：
→ "这道题你读完之后第一个想到的是什么？"
→ "'努力不放弃'——你能想到一个具体故事吗？"
→ "'坚持'的意义不只是考过八级——它还让你得到了什么？"
→ 学生说出"让我知道我其实能做到我以为做不到的事"
→ "这句话就是核心论点"

### Step 2：检验逻辑
只检查逻辑，不补充内容：
- 论点边界：是否"所有情况都成立"还是"有条件成立"
- 论证链条：从A推到B是否完整
- 结构平衡：各部分篇幅是否合理
指出问题后问"你觉得可以怎么补？"

### Step 3：自己动笔（AI不参与）
鼓励语 + 告知"写完整稿后发给我"
如果中途来问，要求学生先自己写一句话

### Step 4：AI首读（三维批改法）
第一步：整体感受（最真实的读者感受）
第二步：三维精准反馈
- 论点层：核心观点是否清晰？论点有没有边界？
- 论据层：例子有没有说服力？论据充分？

每条反馈必须指向具体句子或段落。

## 苏格拉底四步追问法
Step 1 感受差异：把正确句和学生原句并排呈现，问"这两句话意思有什么不同？哪句读起来更顺？为什么？"

## 五类语法错误DNA
①时态混用：叙述过去事件时突然跳到现在时
②主谓一致：第三人称单数忘记变形
③定语从句：who/which/that混淆，或省略关系代词导致歧义
④介词搭配：动词+介词固定搭配记混
⑤长难句：从句套从句导致主干丢失

## 五类错误的专属追问话术

### ①时态混用
Step 1："这两句话，一句说的是'发生过的事'，一句说的是'经常发生的事'——你注意到了吗？"
Step 2："你觉得英语里怎么区分'发生过'和'经常发生'？动词会有什么变化？"
Step 3："那我给你三个句子，你判断用哪个时态……"
Step 4："用一句话总结：什么时候用过去式？"

### ②主谓一致
Step 1："She go 和 She goes，你读起来感觉哪个对？"
Step 2："为什么加s？什么条件下动词要加s？"
Step 3："那这些句子你来填……"
Step 4："一句话总结规律"

### ③定语从句
Step 1："the book which I read 和 the book what I read——哪个对？你感觉区别在哪？"
Step 2："which和what都能翻译成'哪个/什么'——但英语里它们用法不同，你猜区别是什么？"
Step 3：填空练习验证
Step 4：总结关系代词选择规则

### ④介词搭配
Step 1："listen to music 和 listen music，你觉得哪个对？"
Step 2："为什么listen后面要有to？"
Step 3：给出5个动词+介词搭配练习
Step 4：总结记忆方法

### ⑤长难句
Step 1：找出句子里所有动词，确定哪个是主句谓语
Step 2：标记从属连词，拆分主句和从句
Step 3：分别翻译主句和从句
Step 4：合并成完整翻译

## 定语从句专项训练营（6关难度递进）
第一关：选对关系代词（which/who/that/where/when）
第二关：判断是否可以省略关系代词
第三关：which vs that 的区别（非限制性定语从句）
第四关：where/when/why 的关系词替换
第五关：介词+which 的用法
第六关：综合改写（把两个简单句合并为含定语从句的复合句）

## 中国学生高频发音弱点速查
Top 10：
1. /θ/ vs /s/ 和 /ð/ vs /z/（th音）：几乎100%受影响。舌尖伸出齿间。
2. /r/ vs /l/ 混淆：约70%。/r/舌尖悬空，/l/舌尖碰上齿龈。
3. /i:/ vs /ɪ/（长短元音）：约80%。/i:/嘴角拉开，/ɪ/嘴角微开。
4. /v/ vs /w/ 混淆：约50%。/v/上齿咬下唇，/w/双唇收圆。
5. /æ/ vs /e/（梅花音）：约60%。/æ/嘴张大，/e/嘴微开。
6. /ʃ/ vs /tʃ/（sh vs ch）：约40%。
7. /ŋ/ vs /n/（ng音）：约50%。
8. 词尾辅音遗漏：约90%。
9. /ʊ/ vs /u:/（短u与长u）：约40%。
10. /aɪ/ vs /eɪ/：约30%。
发音弱点追踪标准：出现1次→偶发；2次→初步弱项；≥3次→顽固弱项。
攻克标准：连续3次未出现→已改善；连续5次→攻克。
纠音训练设计原则：每次只纠1-3个问题；练习句不超过10词；先模仿再自主；复习间隔参照艾宾浩斯曲线。
按学段重点：小学→th音+词尾辅音+r/l基础区分；初中→长短元音精细区分+v/w/sh/ch；高中→连读语调+弱化音+重音位置。

## 为什么应用题特别难

## 核心方法：数量关系三步提取法
Step 1 识别数量："这道题里出现了几个数量？把它们一个一个说出来"
Step 2 说出关系："用中文描述数量之间的关系，不要写公式"
Step 3 翻译转化："你刚才说的中文关系，如果设为x，能不能改写成含有x的等式？"
收到应用题后绝对不能直接建模或列方程，必须按三步追问让学生自己完成。

## 五大应用题类型专项追问库

### 类型①行程问题（路程=速度×时间）
相遇：路程之和=总距离；追及：路程之差=差距
追问：几个运动物体？→各速度/时间/路程已知未知？→路程关系？→写等式
陷阱：单位统一/同向追及vs相向而行/顺流逆流

### 类型②工程问题（工作量=工作效率×工作时间）
设总工作量=1，甲效率=1/N天
追问：整件工作设为什么？→甲每天几分之几？→合作每天多少？→写等式
误区：直接用天数相加/没有统一"工作量为1"

### 类型③浓度问题（溶质量=溶液量×浓度）
溶质守恒（加水不加溶质）
追问：浓度/溶质/溶液哪些已知？→溶质量变了吗？→变化前后溶质量？→写等式

### 类型④利润问题
利润=售价-成本/利润率=利润÷成本×100%/售价=成本×(1+利润率)
追问：哪些量？→利润和利润率区别？→打折对什么打折？→写等式
混淆：成本vs标价/利润vs利润率/亏损(利润为负)

### 类型⑤增长率问题
简单增长：最终量=原量+原量×增长率×次数
复合增长：最终量=原量×(1+增长率)ⁿ
追问：增长率对原量还是对上一次量？→第二次基数是什么？→写表达式

## 识别题型分类追问
①有运动/流动？→行程/工程
②有混合/稀释？→浓度
③有买卖/折扣/利润？→利润
④有增长率/每年增加？→增长率
⑤以上都不是→通用三步框架

function init() {
  const saved = localStorage.getItem('yw_setting');
  if (saved) {
    const s = JSON.parse(saved);
    document.getElementById('apiKeyInput').value = s.apiKey || '';
    document.getElementById('apiBaseInput').value = s.apiBase || 'https://api.deepseek.com';
    document.getElementById('modelInput').value = s.model || 'deepseek-flash';
    document.getElementById('ttsBaseInput').value = s.ttsBase || '';
  } else {
    document.getElementById('apiKeyInput').value = localStorage.getItem('yw_apiKey') || '';
    document.getElementById('apiBaseInput').value = 'https://api.deepseek.com';
    document.getElementById('modelInput').value = 'deepseek-flash';
    document.getElementById('ttsBaseInput').value = localStorage.getItem('yw_ttsBase') || '';
  }

  currentMode = parseInt(localStorage.getItem('yw_mode') || '0');
  
  for (let i = 0; i < MODES.length; i++) {
    const key = 'yw_conv_' + i;
    const saved_conv = localStorage.getItem(key);
    conversations[i] = saved_conv ? JSON.parse(saved_conv) : [];
  }

  renderSidebar();
  switchMode(currentMode, false);
  
  // Show/hide sidebar toggle button based on screen size
  function updateToggleVisibility() {
    const btn = document.getElementById('sidebarToggle');
    if (window.innerWidth < 640) {
      btn.style.display = 'flex';
    } else {
      btn.style.display = 'none';
    }
  }
  updateToggleVisibility();
  window.addEventListener('resize', updateToggleVisibility);
}

function renderSidebar() {
  const groups = {
    cn: document.getElementById('sidebar-tabs-cn'),
    en: document.getElementById('sidebar-tabs-en'),
    math: document.getElementById('sidebar-tabs-math'),
    method: document.getElementById('sidebar-tabs-method'),
    tools: document.getElementById('sidebar-tabs-tools'),
    physics: document.getElementById('sidebar-tabs-physics')
  };
  // Clear existing content
  Object.values(groups).forEach(g => { if (g) g.innerHTML = ''; });
  
  MODES.forEach((m, i) => {
    const active = i === currentMode ? 'active' : '';
    const tab = `<div class="sidebar-tab ${active}" onclick="switchMode(${i})" data-idx="${i}">
      <span class="tab-emoji">${m.emoji}</span>
      <span class="tab-name">${m.name}</span>
    </div>`;
    if (i < 5) groups.cn.innerHTML += tab;
    else if (i < 10) groups.en.innerHTML += tab;
    else if (i < 15) groups.math.innerHTML += tab;
    else if (i < 22) groups.method.innerHTML += tab;
    else if (i < 27) groups.tools.innerHTML += tab;
    else groups.physics.innerHTML += tab;
  });
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
}

function switchMode(idx, clear = true) {
  currentMode = idx;
  localStorage.setItem('yw_mode', idx);
  document.body.setAttribute('data-mode', idx);
  
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.querySelector(`.sidebar-tab[data-idx="${idx}"]`);
  if (activeTab) activeTab.classList.add('active');
  
  // Close sidebar on mobile after selection
  if (window.innerWidth < 640) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
  
  document.getElementById('inputBox').placeholder = MODES[idx].placeholder;
  renderChat();
}

function renderChat() {
  const area = document.getElementById('chatArea');
  const msgs = conversations[currentMode];
  
  if (!msgs || msgs.length === 0) {
    const m = MODES[currentMode];
    area.innerHTML = `
      <div class="welcome">
        <span class="welcome-icon">${m.welcomeIcon}</span>
        <div class="welcome-title">${m.emoji} ${m.name}</div>
        <div class="welcome-sub">${m.subtitle}</div>
        <div class="quick-btns">
          ${m.quickBtns.map(b => `<button class="quick-btn" onclick="sendQuick('${b}')">${b}</button>`).join('')}
        </div>
      </div>
    `;
    return;
  }
  
  area.innerHTML = msgs.map((msg, i) => renderMessage(msg, i)).join('');
  area.scrollTop = area.scrollHeight;
}

function renderMessage(msg, idx) {
  const isUser = msg.role === 'user';
  const avatar = isUser ? '🧑' : MODES[currentMode].emoji;
  
  let contentHtml = '';
  if (isUser) {
    contentHtml = escapeHtml(msg.content || '');
    if (msg.images && msg.images.length > 0) {
      const imgHtml = msg.images.map(url => `<img class="user-img" src="${url}" alt="上传的图片">`).join('');
      contentHtml = imgHtml + (msg.content ? '<br>' + contentHtml : '');
    }
  } else {
    contentHtml = renderMarkdown(msg.content);
  }
  
  return `
    <div class="msg ${isUser ? 'user' : 'assistant'}">
      <div class="msg-avatar">${avatar}</div>
      <div>
        <div class="msg-bubble">${contentHtml}</div>
        ${!isUser ? `<div class="msg-actions">
          <button class="msg-action-btn" onclick="copyMsg(${idx})"><span class="material-symbols-outlined">content_copy</span> 复制</button>
          ${(currentMode === 6 || currentMode === 7) ? `<button class="tts-play-btn" data-idx="${idx}" onclick="toggleSpeak('${escapeForOnclick(msg.content)}', ${idx})"><span class="material-symbols-outlined">volume_up</span> 朗读</button>` : ''}
        </div>` : ''}
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeForOnclick(text) {
  if (!text) return '';
  return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ').replace(/"/g, '&quot;');
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = text;
  
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  
  html = html.replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, (match, header, body) => {
    const headers = header.split('|').map(h => h.trim()).filter(h => h);
    const rows = body.trim().split('\n').map(row => 
      row.split('|').map(c => c.trim()).filter(c => c)
    );
    let table = '<table><thead><tr>';
    headers.forEach(h => table += `<th>${h}</th>`);
    table += '</tr></thead><tbody>';
    rows.forEach(row => {
      table += '<tr>';
      row.forEach(c => table += `<td>${c}</td>`);
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });
  
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^---$/gm, '<hr>');
  
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<table>)/g, '$1');
  html = html.replace(/(<\/table>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  html = html.replace(/<p>(<hr>)/g, '$1');
  html = html.replace(/(<hr>)<\/p>/g, '$1');
  
  return html;
}

function sendQuick(text) {
  document.getElementById('inputBox').value = text;
  sendMessage();
}

function buildRequestMessages(mode) {
  const history = conversations[mode] || [];
  const recent = [];
  let textSize = 0;
  const maxHistoryMessages = 12;
  const maxHistoryCharacters = 24000;

  for (let i = history.length - 1; i >= 0 && recent.length < maxHistoryMessages; i--) {
    const msg = history[i];
    const size = typeof msg.content === 'string' ? msg.content.length : 0;
    if (recent.length > 0 && textSize + size > maxHistoryCharacters) break;
    recent.unshift(msg);
    textSize += size;
  }

  while (recent.length > 1 && recent[0].role === 'assistant') recent.shift();

  return [
    { role: 'system', content: SYS_PROMPTS[mode] },
    ...recent.map(m => {
      if (m.images && m.images.length > 0) {
        const content = m.images.map(dataUrl => ({
          type: 'image_url',
          image_url: { url: dataUrl }
        }));
        if (m.content) content.push({ type: 'text', text: m.content });
        return { role: m.role, content };
      }
      return { role: m.role, content: m.content };
    })
  ];
}

function getApiErrorMessage(status, raw) {
  if (status === 401 || status === 403) return 'AI 服务认证失败，请在设置中检查 API Key。';
  if (status === 404) return '没有找到当前模型或接口地址，请检查 API 地址和模型名称。';
  if (status === 429) return 'AI 服务当前请求较多，请稍候再试。本次输入已保留。';
  if ([500, 502, 503, 504].includes(status)) return `AI 服务暂时繁忙（${status}），自动重试后仍未恢复。本次输入已保留，请稍候再次发送。`;
  let detail = '';
  try {
    const parsed = JSON.parse(raw);
    detail = parsed?.error?.message || parsed?.message || '';
  } catch (_) {}
  return detail ? `请求未完成（${status}）：${detail}` : `请求未完成（${status}），请检查服务设置后重试。`;
}

function restoreFailedInput(userMsg, input) {
  const history = conversations[currentMode] || [];
  if (history[history.length - 1] === userMsg) history.pop();
  saveConversation(currentMode);
  input.value = userMsg.content || '';
  pendingImages = (userMsg.images || []).map(dataUrl => ({
    dataUrl,
    base64: dataUrl.includes(',') ? dataUrl.split(',')[1] : '',
    mimeType: dataUrl.match(/^data:([^;]+);/)?.[1] || 'image/jpeg'
  }));
  renderImagePreviews();
  autoResize(input);
  renderChat();
}

async function sendMessage() {
  const input = document.getElementById('inputBox');
  const text = input.value.trim();
  const images = [...pendingImages];
  if ((!text && images.length === 0) || isStreaming) return;
  
  const settings = getSettings();
  if (!settings.apiKey) {
    toggleSettings();
    alert('请先设置 API Key');
    return;
  }
  
  const userMsg = { role: 'user', content: text };
  if (images.length > 0) {
    userMsg.images = images.map(img => img.dataUrl);
  }
  conversations[currentMode].push(userMsg);
  saveConversation(currentMode);
  input.value = '';
  pendingImages = [];
  renderImagePreviews();
  autoResize(input);
  renderChat();
  
  const area = document.getElementById('chatArea');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg assistant';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = `
    <div class="msg-avatar">${MODES[currentMode].emoji}</div>
    <div>
      <div class="msg-bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  area.appendChild(typingDiv);
  area.scrollTop = area.scrollHeight;
  
  const messages = buildRequestMessages(currentMode);
  
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  abortController = new AbortController();
  
  let assistantContent = '';
  
  try {
    const endpoint = `${settings.apiBase.replace(/\/+$/, '')}/v1/chat/completions`;
    const requestBody = JSON.stringify({
      model: settings.model,
      messages,
      stream: true,
      temperature: 0.7,
      max_tokens: 4096
    });
    let response;

    for (let attempt = 0; attempt < 3; attempt++) {
      response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${settings.apiKey}`
        },
        body: requestBody,
        signal: abortController.signal
      });

      if (response.ok) break;
      const rawError = await response.text();
      const retryable = [500, 502, 503, 504].includes(response.status);
      if (retryable && attempt < 2) {
        await new Promise(resolve => setTimeout(resolve, 700 * (attempt + 1)));
        continue;
      }
      const apiError = new Error(getApiErrorMessage(response.status, rawError));
      apiError.status = response.status;
      throw apiError;
    }
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    
    typingDiv.remove();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg assistant';
    msgDiv.innerHTML = `
      <div class="msg-avatar">${MODES[currentMode].emoji}</div>
      <div>
        <div class="msg-bubble" id="streaming-bubble"></div>
        <div class="msg-actions">
          <button class="msg-action-btn" onclick="copyMsg(${conversations[currentMode].length})"><span class="material-symbols-outlined">content_copy</span> 复制</button>
        </div>
      </div>
    `;
    area.appendChild(msgDiv);
    const bubble = document.getElementById('streaming-bubble');
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              assistantContent += delta;
              bubble.innerHTML = renderMarkdown(assistantContent);
              area.scrollTop = area.scrollHeight;
            }
          } catch (e) {}
        }
      }
    }
    
    if (assistantContent) {
      conversations[currentMode].push({ role: 'assistant', content: assistantContent });
      saveConversation(currentMode);
    }
    
  } catch (err) {
    typingDiv.remove();
    if (err.name !== 'AbortError') {
      if (!assistantContent) restoreFailedInput(userMsg, input);
      const errDiv = document.createElement('div');
      errDiv.className = 'msg assistant';
      errDiv.innerHTML = `
        <div class="msg-avatar">⚠️</div>
        <div>
          <div class="msg-bubble" style="border-color:var(--error)">
            <strong>暂时没有生成成功</strong><br>${escapeHtml(err.message)}
          </div>
        </div>
      `;
      area.appendChild(errDiv);
    }
  } finally {
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
    abortController = null;
    const streamBubble = document.getElementById('streaming-bubble');
    if (streamBubble) streamBubble.removeAttribute('id');
    area.scrollTop = area.scrollHeight;
  }
}

function getSettings() {
  return {
    apiKey: document.getElementById('apiKeyInput').value || localStorage.getItem('yw_apiKey') || '',
    apiBase: document.getElementById('apiBaseInput').value || 'https://api.deepseek.com',
    model: document.getElementById('modelInput').value || 'deepseek-flash',
    ttsBase: document.getElementById('ttsBaseInput').value || localStorage.getItem('yw_ttsBase') || ''
  };
}

function saveSettings() {
  const settings = getSettings();
  localStorage.setItem('yw_setting', JSON.stringify(settings));
  localStorage.setItem('yw_apiKey', settings.apiKey);
  localStorage.setItem('yw_ttsBase', settings.ttsBase);
  toggleSettings();
}

function toggleSettings() {
  const modal = document.getElementById('settingsModal');
  modal.classList.toggle('show');
  if (modal.classList.contains('show')) {
    const saved = JSON.parse(localStorage.getItem('yw_setting') || '{}');
    if (saved.ttsBase) {
      document.getElementById('ttsBaseInput').value = saved.ttsBase;
    }
  }
}

function newChat() {
  if (conversations[currentMode].length > 0) {
    if (!confirm('确定清空当前对话？')) return;
  }
  conversations[currentMode] = [];
  saveConversation(currentMode);
  renderChat();
}

function saveConversation(mode) {
  localStorage.setItem('yw_conv_' + mode, JSON.stringify(conversations[mode]));
}

function copyMsg(idx) {
  const msgs = conversations[currentMode];
  const text = msgs[idx]?.content || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target.closest('.msg-action-btn');
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined">check</span> 已复制';
      setTimeout(() => { btn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> 复制'; }, 1500);
    }
  });
}

// ===== INPUT HANDLING =====
const inputBox = document.getElementById('inputBox');

// ===== IMAGE HANDLING =====
function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  if (file.size > 5 * 1024 * 1024) {
    alert('图片不能超过5MB');
    event.target.value = '';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const base64 = dataUrl.split(',')[1];
    const mimeType = dataUrl.split(';')[0].split(':')[1];
    pendingImages.push({ base64, dataUrl, mimeType });
    renderImagePreviews();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function renderImagePreviews() {
  const container = document.getElementById('imgPreviewContainer');
  container.innerHTML = pendingImages.map((img, i) => `
    <div class="img-preview-wrap" style="display:block">
      <img src="${img.dataUrl}" alt="待发送图片">
      <button class="img-preview-remove" onclick="removePendingImage(${i})">×</button>
    </div>
  `).join('');
}

function removePendingImage(idx) {
  pendingImages.splice(idx, 1);
  renderImagePreviews();
}

inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputBox.addEventListener('input', () => autoResize(inputBox));

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

document.getElementById('settingsModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) toggleSettings();
});

// ===== TTS (Text-to-Speech) =====
let ttsUtterance = null;
let ttsPlaying = false;
let currentPlayingIdx = -1;

function getTTSVoices() {
  const voices = speechSynthesis.getVoices();
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  return enVoices.length > 0 ? enVoices : voices;
}

function speakText(text, idx) {
  stopSpeaking();
  
  let cleanText = text
    .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^#+ /gm, '')
    .replace(/^- /gm, '')
    .replace(/^>\s?/gm, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/\n{2,}/g, '. ')
    .replace(/\n/g, '. ')
    .trim();
  
  const settings = getSettings();
  
  if (settings.ttsBase) {
    speakWithEdgeTTS(cleanText, idx, settings.ttsBase);
    return;
  }
  
  const utterance = new SpeechSynthesisUtterance(cleanText);
  const voices = getTTSVoices();
  
  const preferred = voices.find(v => v.lang.startsWith('en-US')) || 
                    voices.find(v => v.lang.startsWith('en-GB')) ||
                    voices.find(v => v.lang.startsWith('en'));
  if (preferred) utterance.voice = preferred;
  
  utterance.rate = 0.85;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  utterance.onstart = () => {
    ttsPlaying = true;
    currentPlayingIdx = idx;
    updateTTSButtons();
  };
  
  utterance.onend = () => {
    ttsPlaying = false;
    currentPlayingIdx = -1;
    updateTTSButtons();
  };
  
  utterance.onerror = () => {
    ttsPlaying = false;
    currentPlayingIdx = -1;
    updateTTSButtons();
  };
  
  ttsUtterance = utterance;
  speechSynthesis.speak(utterance);
}

let ttsAudio = null;

function speakWithEdgeTTS(text, idx, ttsBase) {
  const url = `${ttsBase}/tts?text=${encodeURIComponent(text)}&voice=en-US-JennyNeural&rate=-10%`;
  
  ttsAudio = new Audio(url);
  ttsAudio.onplay = () => {
    ttsPlaying = true;
    currentPlayingIdx = idx;
    updateTTSButtons();
  };
  ttsAudio.onended = () => {
    ttsPlaying = false;
    currentPlayingIdx = -1;
    updateTTSButtons();
  };
  ttsAudio.onerror = () => {
    ttsPlaying = false;
    currentPlayingIdx = -1;
    updateTTSButtons();
    speakTextWebSpeech(text, idx);
  };
  ttsAudio.play();
}

function speakTextWebSpeech(text, idx) {
  const utterance = new SpeechSynthesisUtterance(text);
  const voices = getTTSVoices();
  const preferred = voices.find(v => v.lang.startsWith('en-US')) || 
                    voices.find(v => v.lang.startsWith('en'));
  if (preferred) utterance.voice = preferred;
  utterance.rate = 0.85;
  utterance.onstart = () => {
    ttsPlaying = true;
    currentPlayingIdx = idx;
    updateTTSButtons();
  };
  utterance.onend = utterance.onerror = () => {
    ttsPlaying = false;
    currentPlayingIdx = -1;
    updateTTSButtons();
  };
  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (ttsAudio) {
    ttsAudio.pause();
    ttsAudio = null;
  }
  ttsPlaying = false;
  currentPlayingIdx = -1;
  updateTTSButtons();
}

function toggleSpeak(text, idx) {
  if (ttsPlaying && currentPlayingIdx === idx) {
    stopSpeaking();
  } else {
    speakText(text, idx);
  }
}

function updateTTSButtons() {
  document.querySelectorAll('.tts-play-btn').forEach(btn => {
    const btnIdx = parseInt(btn.dataset.idx);
    if (btnIdx === currentPlayingIdx && ttsPlaying) {
      btn.classList.add('playing');
      btn.innerHTML = '<span class="material-symbols-outlined">pause</span> 停止';
    } else {
      btn.classList.remove('playing');
      btn.innerHTML = '<span class="material-symbols-outlined">volume_up</span> 朗读';
    }
  });
}

if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

// ===== START =====
init();
